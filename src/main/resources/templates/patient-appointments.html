
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments | CarePoint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #173b68;
        }

        .appointment-card {
            border: none;
            border-radius: 14px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">
        <i class="bi bi-hospital"></i> CarePoint
    </span>

    <div>
        <a th:href="@{/patient/dashboard}"
           class="btn btn-outline-light btn-sm me-2">
            Dashboard
        </a>

        <a th:href="@{/logout}"
           class="btn btn-outline-light btn-sm">
            Logout
        </a>
    </div>
</nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">

        <div>
            <h2 class="fw-bold mb-2">
                <i class="bi bi-calendar-check me-2"></i>My Appointments
            </h2>

            <p class="text-muted mb-0">
                View your appointment details and schedules.
            </p>
        </div>

        <a th:href="@{/patient/appointments/book}"
           class="btn btn-primary">
            <i class="bi bi-plus-circle me-2"></i>
            Book New Appointment
        </a>

    </div>

    <div th:if="${message != null}"
         class="alert alert-warning mt-3"
         th:text="${message}">
    </div>

    <div class="card appointment-card shadow-sm p-4 mt-4">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Appointment ID</th>
                        <th>Doctor ID</th>
                        <th>Appointment Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="appointment : ${appointments}">

                        <td th:text="${appointment.appointmentId}"></td>

                        <td th:text="${appointment.doctorId}"></td>

                        <td th:text="${appointment.appointmentDate}"></td>

                        <td>
                            <span class="badge"
                                  th:classappend="${appointment.status == 'Cancelled'} ? ' bg-danger' : (${appointment.status == 'Completed'} ? ' bg-secondary' : ' bg-success')"
                                  th:text="${appointment.status}">
                            </span>
                        </td>

                        <td>

                            <form th:if="${appointment.status != 'Completed' and appointment.status != 'Cancelled'}"
                                  th:action="@{/patient/appointments/cancel/{id}(id=${appointment.appointmentId})}"
                                  method="post"
                                  onsubmit="return confirm('Are you sure you want to cancel this appointment?');">

                                <!-- CSRF Security Token -->
                                

                                <button type="submit"
                                        class="btn btn-danger btn-sm">
                                    <i class="bi bi-x-circle"></i>
                                    Cancel
                                </button>

                            </form>

                            <span th:if="${appointment.status == 'Cancelled'}"
                                  class="text-danger small">
                                Cancelled
                            </span>

                            <span th:if="${appointment.status == 'Completed'}"
                                  class="text-muted small">
                                Completed
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-calendar-x fs-3"></i>

                            <p class="mt-2 mb-0">
                                No appointments found.
                            </p>

                            <p class="small">
                                Book your first appointment using the button above.
                            </p>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
