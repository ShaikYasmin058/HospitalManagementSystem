
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Registration | CarePoint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e8f0ff, #f5f7fb);
            font-family: Arial, sans-serif;
        }

        .register-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .brand {
            color: #2563eb;
            font-weight: bold;
        }

        .form-control {
            padding: 11px;
        }

        .btn-register {
            background: #2563eb;
            color: white;
            padding: 11px;
            border: none;
        }

        .btn-register:hover {
            background: #1d4ed8;
            color: white;
        }
    </style>
</head>

<body>

<div class="register-card">

    <div class="text-center mb-4">
        <h2 class="brand">CarePoint</h2>
        <h4>Admin Registration</h4>
        <p class="text-muted">Create your administrator account</p>
    </div>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <form th:action="@{/register}" method="post">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="fullName"
                   class="form-control"
                   placeholder="Enter full name"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username"
                   class="form-control"
                   placeholder="Choose username"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email"
                   class="form-control"
                   placeholder="Enter email address"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password"
                   class="form-control"
                   placeholder="Create password"
                   minlength="8"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirmPassword"
                   class="form-control"
                   placeholder="Confirm password"
                   minlength="8"
                   required>
        </div>

        <button type="submit"
                class="btn btn-register w-100">
            Create Account
        </button>

    </form>

    <p class="text-center mt-4 mb-0">
        Already have an account?
        <a th:href="@{/login}">Login here</a>
    </p>

</div>

</body>
</html>
