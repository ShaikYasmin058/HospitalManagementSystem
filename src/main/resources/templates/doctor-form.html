<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Doctor Form</title>
</head>

<body>
<div th:fragment="content">

    <h2 class="mb-4"
        th:text="${doctor.id == null ? 'Add Doctor' : 'Edit Doctor'}">
        Doctor Form
    </h2>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <form th:action="@{/doctors}"
          th:object="${doctor}"
          method="post"
          enctype="multipart/form-data"
          class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}" />

        <div th:if="${#fields.hasErrors('*')}"
             class="alert alert-danger">

            <strong>Please correct these errors:</strong>

            <ul class="mb-0">
                <li th:each="error : ${#fields.allErrors()}"
                    th:text="${error}"></li>
            </ul>
        </div>

        <h5>Doctor Details</h5>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control"
                   th:field="*{name}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Specialization</label>
            <input class="form-control"
                   th:field="*{specialization}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input class="form-control"
                   th:field="*{phone}"
                   maxlength="10" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control"
                   type="email"
                   th:field="*{email}" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Availability Status</label>

            <select class="form-select"
                    th:field="*{availabilityStatus}"
                    required>

                <option value="AVAILABLE">Available</option>
                <option value="ON_LEAVE">On Leave</option>
                <option value="UNAVAILABLE">Unavailable</option>

            </select>

            <small class="text-muted">
                Select the doctor's current availability status.
            </small>
        </div>

        <div class="mb-3">
            <label class="form-label">Doctor Profile Photo</label>

            <input class="form-control"
                   type="file"
                   name="photoFile"
                   accept="image/*" />

            <small class="text-muted">
                Upload a JPG, JPEG or PNG photo.
            </small>
        </div>

        <div th:if="${doctor.id == null}">
            <hr />
            <h5>Doctor Login Details</h5>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control"
                       type="text"
                       name="username" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control"
                       type="password"
                       name="password"
                       minlength="6" required />
            </div>
        </div>

        <button class="btn btn-primary"
                type="submit"
                th:text="${doctor.id == null ? 'Save Doctor' : 'Update Doctor'}">
            Save
        </button>

        <a href="/doctors" class="btn btn-secondary mt-2">
            Back to Doctors
        </a>

    </form>
</div>
</body>
</html>
