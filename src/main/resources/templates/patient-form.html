
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>Patient Form</title>
</head>
<body>
<div th:fragment="content">

    <h2 class="mb-4">Patient Form</h2>

    <div th:if="${error}" class="alert alert-danger"
         th:text="${error}"></div>

    <form th:action="@{/patients}"
          th:object="${patient}"
          method="post"
          class="card p-4 shadow-sm">

        <input type="hidden" th:field="*{patientId}" />

        <h5>Patient Details</h5>

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" th:field="*{name}" required />
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input class="form-control" th:field="*{phone}"
                   maxlength="10" required />
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('phone')}"
                 th:errors="*{phone}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Age</label>
            <input class="form-control" type="number"
                   th:field="*{age}" min="1" required />
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('age')}"
                 th:errors="*{age}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Gender</label>
            <select class="form-select" th:field="*{gender}" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('gender')}"
                 th:errors="*{gender}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Disease</label>
            <input class="form-control" th:field="*{disease}" required />
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('disease')}"
                 th:errors="*{disease}"></div>
        </div>

        <!-- Show login fields for new patients or patients without accounts -->
        <div th:if="${patient.patientId == null or patient.accountId == null}">
            <hr />
            <h5>Patient Login Details</h5>

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" type="text"
                       name="username" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" type="email"
                       name="email" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input class="form-control" type="password"
                       name="password" minlength="6" required />
            </div>
        </div>

        <button class="btn btn-primary" type="submit">Save Patient</button>

    </form>
</div>
</body>
</html>
