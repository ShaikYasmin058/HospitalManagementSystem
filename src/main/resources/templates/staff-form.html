
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Staff Form</title>
</head>

<body>
<div th:fragment="content">

    <div class="mb-4">
        <h2 th:text="${staff.staffId == null ? 'Add New Staff' : 'Edit Staff'}">
            Staff Form
        </h2>
        <p class="text-muted">Enter hospital employee information.</p>
    </div>

    <form th:action="@{/staff}"
          th:object="${staff}"
          method="post"
          class="card shadow-sm p-4">

        <input type="hidden" th:field="*{staffId}"/>

        <div th:if="${#fields.hasErrors('*')}"
             class="alert alert-danger">
            <strong>Please correct the following errors:</strong>
            <ul class="mb-0">
                <li th:each="error : ${#fields.allErrors()}"
                    th:text="${error}">
                </li>
            </ul>
        </div>

        <h5 class="mb-3">Personal Information</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text"
                       class="form-control"
                       th:field="*{name}"
                       placeholder="Enter full name"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Age</label>
                <input type="number"
                       class="form-control"
                       th:field="*{age}"
                       min="18"
                       placeholder="Enter age"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Gender</label>
                <select class="form-select"
                        th:field="*{gender}"
                        required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel"
                       class="form-control"
                       th:field="*{phone}"
                       pattern="[0-9]{10}"
                       maxlength="10"
                       placeholder="10-digit phone number"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Email Address</label>
                <input type="email"
                       class="form-control"
                       th:field="*{email}"
                       placeholder="Enter email address"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Address</label>
                <input type="text"
                       class="form-control"
                       th:field="*{address}"
                       placeholder="Enter address"/>
            </div>

        </div>

        <hr>

        <h5 class="mb-3">Professional Information</h5>

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <select class="form-select"
                        th:field="*{department}"
                        required>
                    <option value="">Select Department</option>
                    <option value="Administration">Administration</option>
                    <option value="Nursing">Nursing</option>
                    <option value="Pharmacy">Pharmacy</option>
                    <option value="Laboratory">Laboratory</option>
                    <option value="Reception">Reception</option>
                    <option value="Accounts">Accounts</option>
                    <option value="Housekeeping">Housekeeping</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Designation</label>
                <input type="text"
                       class="form-control"
                       th:field="*{designation}"
                       placeholder="e.g. Nurse, Receptionist"
                       required/>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Monthly Salary (₹)</label>
                <input type="number"
                       class="form-control"
                       th:field="*{salary}"
                       min="0"
                       step="0.01"
                       placeholder="Enter monthly salary"
                       required/>
            </div>

        </div>

        <div class="mt-3">

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i>
                <span th:text="${staff.staffId == null ? 'Save Staff' : 'Update Staff'}">
                    Save Staff
                </span>
            </button>

            <a href="/staff" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>
</body>
</html>
