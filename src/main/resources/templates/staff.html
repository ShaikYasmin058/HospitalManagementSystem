
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Staff Management</title>
</head>

<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Staff Management</h2>
            <p class="text-muted">Manage hospital employees and their details.</p>
        </div>

        <a href="/staff/new" class="btn btn-primary">
            <i class="bi bi-person-plus-fill"></i> Add New Staff
        </a>
    </div>

    <!-- Search -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">

            <form action="/staff" method="get" class="row g-2">

                <div class="col-md-9">
                    <input type="text"
                           name="keyword"
                           class="form-control"
                           placeholder="Search by staff name or department..."
                           th:value="${keyword}">
                </div>

                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Staff Table -->
    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead class="table-light">
                        <tr>
                            <th>Staff ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="member : ${staffList}">

                            <td th:text="${member.staffId}"></td>
                            <td th:text="${member.name}"></td>
                            <td th:text="${member.age}"></td>
                            <td th:text="${member.gender}"></td>
                            <td th:text="${member.phone}"></td>
                            <td th:text="${member.email}"></td>
                            <td th:text="${member.department}"></td>
                            <td th:text="${member.designation}"></td>

                            <td th:text="${'₹ ' + member.salary}"></td>

                            <td>
                                <a th:href="@{/staff/edit/{id}(id=${member.staffId})}"
                                   class="btn btn-sm btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <a th:href="@{/staff/delete/{id}(id=${member.staffId})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this staff member?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(staffList)}">
                            <td colspan="10"
                                class="text-center text-muted py-4">
                                No staff records available.
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>
    </div>

</div>
</body>
</html>
