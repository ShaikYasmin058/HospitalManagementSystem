
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | CarePoint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #173b68;
        }

        .profile-card {
            border: none;
            border-radius: 16px;
        }

        .form-label {
            font-weight: 600;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark px-4 py-3">
    <span class="navbar-brand fw-bold">
        <i class="bi bi-hospital"></i> CarePoint
    </span>

    <a th:href="@{/patient/dashboard}"
       class="btn btn-outline-light btn-sm">
        Back to Dashboard
    </a>
</nav>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card profile-card shadow-sm p-4">

                <h3 class="fw-bold mb-2">
                    <i class="bi bi-person-gear me-2"></i>
                    Edit My Profile
                </h3>

                <p class="text-muted mb-4">
                    Update your personal and healthcare information.
                </p>

                <form th:action="@{/patient/profile/update}"
                      th:object="${patient}"
                      method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text"
                                   th:field="*{name}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Age</label>
                            <input type="number"
                                   th:field="*{age}"
                                   class="form-control"
                                   min="1"
                                   max="120"
                                   required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <select th:field="*{gender}"
                                    class="form-select"
                                    required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone Number</label>
                            <input type="tel"
                                   th:field="*{phone}"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Disease / Health Condition</label>
                            <input type="text"
                                   th:field="*{disease}"
                                   class="form-control">
                        </div>

                    </div>

                    <div class="d-flex gap-2 mt-4">

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>
                            Save Changes
                        </button>

                        <a th:href="@{/patient/dashboard}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
