
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Billing | CarePoint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div>
            <h2 class="fw-bold">
                <i class="bi bi-receipt text-primary"></i>
                My Billing
            </h2>
            <p class="text-muted mb-0">
                View your hospital bills and payment details.
            </p>
        </div>

        <a th:href="@{/patient/dashboard}" class="btn btn-outline-primary">
            <i class="bi bi-arrow-left"></i> Back to Dashboard
        </a>
    </div>

    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <h5 class="fw-bold mb-2">Patient Information</h5>
            <p class="mb-1">
                <strong>Name:</strong>
                <span th:text="${patient.name}"></span>
            </p>
            <p class="mb-0">
                <strong>Patient ID:</strong>
                <span th:text="${patient.patientId}"></span>
            </p>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body">

            <h5 class="fw-bold mb-3">Billing History</h5>

            <div th:if="${#lists.isEmpty(bills)}"
                 class="alert alert-info mb-0">
                <i class="bi bi-info-circle"></i>
                No billing records found for your account.
            </div>

            <div th:unless="${#lists.isEmpty(bills)}"
                 class="table-responsive">

                <table class="table table-hover align-middle">
                    <thead class="table-primary">
                    <tr>
                        <th>Bill ID</th>
                        <th>Bill Date</th>
                        <th>Consultation</th>
                        <th>Medicine</th>
                        <th>Treatment</th>
                        <th>Total Amount</th>
                        <th>Payment Status</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="bill : ${bills}">
                        <td th:text="${bill.billId}"></td>

                        <td th:text="${bill.billDate}"></td>

                        <td>
                            ₹<span th:text="${#numbers.formatDecimal(bill.consultationCharge, 1, 2)}"></span>
                        </td>

                        <td>
                            ₹<span th:text="${#numbers.formatDecimal(bill.medicineCharge, 1, 2)}"></span>
                        </td>

                        <td>
                            ₹<span th:text="${#numbers.formatDecimal(bill.treatmentCharge, 1, 2)}"></span>
                        </td>

                        <td class="fw-bold">
                            ₹<span th:text="${#numbers.formatDecimal(bill.totalAmount, 1, 2)}"></span>
                        </td>

                        <td>
                            <span th:if="${bill.paymentStatus == 'Paid'}"
                                  class="badge bg-success"
                                  th:text="${bill.paymentStatus}">
                            </span>

                            <span th:unless="${bill.paymentStatus == 'Paid'}"
                                  class="badge bg-warning text-dark"
                                  th:text="${bill.paymentStatus}">
                            </span>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</div>

</body>
</html>
