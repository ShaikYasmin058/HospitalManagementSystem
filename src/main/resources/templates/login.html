
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CarePoint Hospital</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet" />

    <style>
        body {
            background: linear-gradient(135deg, #eaf3ff, #f8fbff);
            min-height: 100vh;
        }

        .login-card {
            border: none;
            border-radius: 18px;
        }

        .brand {
            color: #1763a6;
            font-weight: 800;
        }

        .doctor-link {
            display: block;
            text-align: center;
            text-decoration: none;
            padding: 12px;
            border: 1px solid #1763a6;
            border-radius: 8px;
            color: #1763a6;
            font-weight: 600;
            transition: 0.3s;
        }

        .doctor-link:hover {
            background: #1763a6;
            color: white;
        }
    </style>
</head>

<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow login-card">
                <div class="card-body p-4">

                    <h2 class="text-center mb-2 brand">CarePoint</h2>

                    <p class="text-center text-muted mb-4">
                        Hospital Management System
                    </p>

                    <div th:if="${success}"
                         class="alert alert-success"
                         th:text="${success}">
                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <form method="post" th:action="@{/login}">

                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text"
                                   class="form-control"
                                   name="username"
                                   placeholder="Enter username"
                                   required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password"
                                   class="form-control"
                                   name="password"
                                   placeholder="Enter password"
                                   required />
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100">
                            Login
                        </button>

                    </form>

                    <hr />

                    <p class="text-center mb-3">
                        Don't have an account?
                        <a th:href="@{/register}">
                            Create New Account
                        </a>
                    </p>

                    <a href="/directory/doctors" class="doctor-link">
                        Meet Our Doctors →
                    </a>

                    <p class="text-center text-muted small mt-3 mb-0">
                        Explore our doctors and their specializations.
                    </p>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
