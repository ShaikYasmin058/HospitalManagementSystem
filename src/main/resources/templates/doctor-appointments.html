
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">
<head>
    <title>My Appointments | CarePoint</title>
</head>
<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>My Appointments</h2>

        <a th:href="@{/doctor/dashboard}"
           class="btn btn-secondary">
            Back to Dashboard
        </a>
    </div>

    <div th:if="${error}"
         class="alert alert-warning"
         th:text="${error}">
    </div>

    <div th:if="${doctor != null}" class="card shadow-sm p-3">

        <h5 th:text="'Dr. ' + ${doctor.name}"></h5>

        <div class="table-responsive mt-3">

            <table class="table table-striped table-bordered align-middle">

                <thead class="table-light">
                    <tr>
                        <th>Appointment ID</th>
                        <th>Patient ID</th>
                        <th>Appointment Date</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:if="${#lists.isEmpty(appointments)}">
                        <td colspan="5"
                            class="text-center text-muted py-4">
                            No appointments found.
                        </td>
                    </tr>

                    <tr th:each="appointment : ${appointments}">

                        <td th:text="${appointment.appointmentId}"></td>

                        <td th:text="${appointment.patientId}"></td>

                        <td th:text="${appointment.appointmentDate}"></td>

                        <td>
                            <span th:text="${appointment.status}"
                                  class="badge bg-primary">
                            </span>
                        </td>

                        <td>
                            <a th:if="${appointment.patientId != null
                                      and appointment.status != 'Cancelled'}"
                               th:href="@{/doctor/medical-records/new(patientId=${appointment.patientId})}"
                               class="btn btn-sm btn-success">
                                <i class="bi bi-file-medical"></i>
                                Create Medical Record
                            </a>

                            <span th:if="${appointment.patientId == null
                                         or appointment.status == 'Cancelled'}"
                                  class="text-muted">
                                Not available
                            </span>
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

        <div class="mt-3">
            <a th:href="@{/doctor/medical-records}"
               class="btn btn-outline-primary">
                View My Medical Records
            </a>
        </div>

    </div>

</div>
</body>
</html>
