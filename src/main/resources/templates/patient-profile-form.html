<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patient Profile | CarePoint</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Complete Your Patient Profile</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/patient/profile}"
                  th:object="${patient}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" th:field="*{name}"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" th:field="*{age}"
                           class="form-control" min="1" max="120" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select th:field="*{gender}" class="form-select" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" th:field="*{phone}"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Disease / Health Concern</label>
                    <input type="text" th:field="*{disease}"
                           class="form-control">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Save Profile
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
