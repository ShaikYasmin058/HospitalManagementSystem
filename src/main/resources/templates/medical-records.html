
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::content})}">

<head>
    <title>Medical Records</title>
</head>

<body>
<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2>Patient Medical Records</h2>
            <p class="text-muted">Manage patient diagnosis and treatment history.</p>
        </div>

        <a href="/medical-records/new" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Add Medical Record
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Patient</th>
                            <th>Diagnosis</th>
                            <th>Symptoms</th>
                            <th>Treatment</th>
                            <th>Medicines</th>
                            <th>Record Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="record : ${medicalRecords}">

                            <td th:text="${record.recordId}"></td>

                            <td>
                                <span th:each="patient : ${patients}"
                                      th:if="${patient.patientId == record.patientId}"
                                      th:text="${patient.name}">
                                </span>
                            </td>

                            <td th:text="${record.diagnosis}"></td>

                            <td th:text="${record.symptoms}"></td>

                            <td th:text="${record.treatment}"></td>

                            <td th:text="${record.prescribedMedicines}"></td>

                            <td th:text="${record.recordDate}"></td>

                            <td>
                                <a th:href="@{/medical-records/edit/{id}(id=${record.recordId})}"
                                   class="btn btn-sm btn-warning">
                                    <i class="bi bi-pencil"></i>
                                </a>

                                <a th:href="@{/medical-records/delete/{id}(id=${record.recordId})}"
                                   class="btn btn-sm btn-danger"
                                   onclick="return confirm('Delete this medical record?')">
                                    <i class="bi bi-trash"></i>
                                </a>

                                <a th:href="@{/medical-records/patient/{patientId}(patientId=${record.patientId})}"
                                   class="btn btn-sm btn-info">
                                    <i class="bi bi-eye"></i>
                                </a>
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(medicalRecords)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                No medical records available.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>
</body>
</html>
